<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Castle Siege art gallery</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;700&display=swap">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #17140e; color: #ece2c6; font-family: "Alegreya Sans", "Segoe UI", system-ui, sans-serif; padding-inline: 16px; padding-block: 24px; }
  h1 { font-family: "IM Fell English SC", "Palatino Linotype", Georgia, serif; font-weight: 400; font-size: 36px; margin: 0 0 4px; }
  p.lead { margin: 0 0 24px; color: #a99d80; max-width: 60ch; }
  h2 { font-family: "IM Fell English SC", "Palatino Linotype", Georgia, serif; font-weight: 400; font-size: 24px; margin: 28px 0 10px; border-bottom: 1px solid #4a412e; padding-bottom: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  canvas { width: 100%; aspect-ratio: 8 / 5; display: block; border-radius: 6px; border: 2px solid #4a412e; background: #120f22; }
</style>
<h1>Castle Siege</h1>
<p class="lead">Every army, homeland, Grand Campaign map and monster, painted procedurally from <code>art/gallery.js</code>.</p>
<h2>The five armies</h2><div class="grid" id="army"></div>
<h2>Homelands</h2><div class="grid" id="map"></div>
<h2>Grand Campaign maps</h2><div class="grid" id="grand"></div>
<h2>Monsters</h2><div class="grid" id="monster"></div>
<script src="launch-bg.js"></script>
<script src="gallery.js"></script>
<script>
  const W = 960, H = 600;
  for (const panel of galleryPanels) {
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    cv.setAttribute('role', 'img');
    document.getElementById(panel.kind).append(cv);
    paintGalleryPanel(cv.getContext('2d'), W, H, panel);
  }
</script>
</html>
