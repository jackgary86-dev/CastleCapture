name: Balance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check every script
        run: for f in js/*.js tools/*.js; do node --check "$f"; done
      - name: Smoke test
        # Loads every script index.html loads, in order, with stand-in browser objects, then plays,
        # saves, resumes and finishes two battles. Catches load-order mistakes and render/UI crashes
        # that the balance test, which only loads data.js and sim.js, can't see.
        run: node tools/smoke.js
      - name: AI-vs-AI balance test (Warlord)
        # 8 games per pairing (32 per army) keeps the win rates stable; runs are seeded, so results are repeatable.
        run: node tools/balance.js --games 8
      - name: AI-vs-AI balance test (Knight)
        run: node tools/balance.js --games 8 --diff medium
